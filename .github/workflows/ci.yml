name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Build and test (core, pedro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo ships gradle-wrapper.jar; check it is a genuine release.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test'
          if-no-files-found: ignore
      - name: Upload the files the WPILib parity tests compare
        uses: actions/upload-artifact@v4
        with:
          name: logcheck-files
          path: core/build/logcheck
          # ParityFilesTest SKIPS itself if it can't find the scenario file, and
          # then writes nothing. Without this, the upload quietly produces no
          # artifact and the parity job below fails with "artifact not found"
          # instead of naming the real cause.
          if-no-files-found: error

  wpilib-parity:
    name: WPILib parity (robotpy)
    needs: jvm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: logcheck-files
          path: core/build/logcheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/logcheck/requirements.txt
      # Compares our files byte-for-byte against WPILib's own native writer.
      - run: python -m unittest discover -s tools/logcheck -v

  android:
    name: Build the FTC module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      # GitHub's ubuntu runners already ship the Android SDK with ANDROID_HOME
      # set, which is what settings.gradle looks for -- so no setup action is
      # needed. (android-actions/setup-android@v3 is what was failing here.)
      - name: Show the Android SDK the runner provides
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -n "$ANDROID_HOME" || { echo 'No Android SDK on this runner.'; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - name: Fail early if settings.gradle did not include :ftc
        run: ./gradlew projects | grep -q "':ftc'" || {
             echo 'The :ftc module was not included -- no Android SDK was detected.'; exit 1; }
      - run: ./gradlew :ftc:assembleRelease --stacktrace
      - name: Upload the AAR
        uses: actions/upload-artifact@v4
        with:
          name: ftc-aar
          path: ftc/build/outputs/aar/*.aar
          if-no-files-found: error
